<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Evolution Optical Voucher</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:#fff;padding:28px 18px}.brand{font-size:22px;font-weight:900}.sub{margin-top:8px;font-size:13px;opacity:.85}main{max-width:700px;margin:auto;padding:14px}.card{background:white;margin:14px 0;padding:18px;border-radius:18px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font-size:16px}input,select{border:1px solid #ccc;background:#fff}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:15px}.voucher{text-align:center;border:1px dashed #aaa;border-radius:14px;padding:18px}.hidden{display:none}#qrcode{display:flex;justify-content:center;margin:15px}.valid{background:#e9f8ef;color:#166534;padding:10px;border-radius:10px;font-weight:800}.id{font-family:monospace;font-weight:800;font-size:18px}.note{font-size:12px;color:#6b7280;margin-top:10px}</style></head><body><header><div class="brand">EVOLUTION OPTICAL</div><div class="sub">QR Voucher</div></header><main><div class="card"><h2>Create Voucher</h2><label>Customer Name</label><input id="customerName"><label>Phone</label><input id="customerPhone" inputmode="tel"><label>IC / Passport</label><input id="customerIc"><label>Voucher</label><select id="voucherType"><option>Free Glasses</option><option>RM59 Free Glasses</option><option>RM100 Optical Voucher</option></select><label>Expiry</label><input id="voucherExpiry" type="date"><button id="generateBtn" type="button">GENERATE QR VOUCHER</button><div class="note" id="errorMsg"></div></div><div id="out" class="card hidden"><div class="voucher"><b>EVOLUTION OPTICAL</b><h2 id="vt"></h2><div id="qrcode"></div><div class="id" id="vid"></div><p id="vc"></p><p id="ve"></p><div class="valid">VALID</div></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>document.getElementById('generateBtn').addEventListener('click',function(){const customerName=document.getElementById('customerName').value.trim();const customerPhone=document.getElementById('customerPhone').value.trim();const voucherType=document.getElementById('voucherType').value;const voucherExpiry=document.getElementById('voucherExpiry').value;const errorMsg=document.getElementById('errorMsg');errorMsg.textContent='';if(!customerName||!customerPhone){alert('Please enter customer name and phone.');return;}if(typeof QRCode==='undefined'){errorMsg.textContent='QR library failed to load. Refresh Safari and try again.';alert('QR library failed to load.');return;}const voucherId='EO-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById('out').classList.remove('hidden');document.getElementById('vt').textContent=voucherType;document.getElementById('vid').textContent=voucherId;document.getElementById('vc').textContent=customerName+' • '+customerPhone;document.getElementById('ve').textContent='Valid until: '+(voucherExpiry||'No expiry');const qrBox=document.getElementById('qrcode');qrBox.innerHTML='';new QRCode(qrBox,{text:voucherId,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});document.getElementById('out').scrollIntoView({behavior:'smooth'});});</script></body></html>

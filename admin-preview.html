    const enhancementJS="\n(function(){\n  function esc2(s){return String(s??\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]))}\n\n  function installBranchCreateUI(){\n    const limit=document.getElementById(\"newPartnerLimit\");\n    const grid=limit?.closest(\".create-grid\");\n    if(!grid || document.getElementById(\"newPartnerBranchBox\")) return;\n\n    const box=document.createElement(\"div\");\n    box.id=\"newPartnerBranchBox\";\n    box.className=\"field wide\";\n    box.innerHTML=`<div class=\"branch-title\">Voucher Claim Branch Permission</div>\n      <label class=\"branch-all\"><input id=\"newPartnerAllBranches\" type=\"checkbox\" checked>\n        <span><b>All Evolution Optical branches</b><br><small style=\"color:#718096\">Or untick to select specific branches.</small></span>\n      </label>\n      <div id=\"newPartnerBranchList\"></div>`;\n    grid.appendChild(box);\n\n    const render=()=>{\n      const all=document.getElementById(\"newPartnerAllBranches\");\n      const list=document.getElementById(\"newPartnerBranchList\");\n      if(!list) return;\n      const rows=(typeof branches!==\"undefined\" && Array.isArray(branches)?branches:[])\n        .filter(b=>String(b.status||\"active\").toLowerCase()===\"active\");\n      list.innerHTML=rows.length?rows.map(b=>`<label><input class=\"newPartnerBranchCheck\" type=\"checkbox\" value=\"${esc2(b.branch_code)}\" ${all?.checked?\"disabled\":\"\"}><span>${esc2(String(b.branch_name||b.branch_code).replace(/\\s*\\(HQ\\)\\s*/gi,\" \").trim())}</span></label>`).join(\"\")\n        :`<small style=\"color:#718096\">Branches will appear after dashboard data finishes loading.</small>`;\n    };\n    box.querySelector(\"#newPartnerAllBranches\").onchange=e=>{\n      box.querySelectorAll(\".newPartnerBranchCheck\").forEach(x=>x.disabled=e.target.checked);\n    };\n    render();\n    setTimeout(render,700);setTimeout(render,1800);\n\n    const btn=document.getElementById(\"createPartnerBtn\");\n    if(btn && !btn.dataset.branchWrapped){\n      btn.dataset.branchWrapped=\"1\";\n      const original=btn.onclick;\n      btn.onclick=async function(e){\n        const code=(document.getElementById(\"newPartnerCode\")?.value||\"\").trim().toUpperCase();\n        const all=document.getElementById(\"newPartnerAllBranches\")?.checked!==false;\n        const codes=[...document.querySelectorAll(\".newPartnerBranchCheck:checked\")].map(x=>x.value);\n        if(!all && !codes.length){\n          const out=document.getElementById(\"createPartnerMsg\");\n          if(typeof msg===\"function\" && out) msg(out,\"Please select at least one branch, or choose All Evolution Optical branches.\");\n          return;\n        }\n        if(original) await original.call(this,e);\n        const out=document.getElementById(\"createPartnerMsg\");\n        if(!code || !out || !/created successfully/i.test(out.textContent||\"\")) return;\n        try{\n          const {data:p,error:qerr}=await db.from(\"partners\").select(\"id,partner_name\").eq(\"partner_code\",code).maybeSingle();\n          if(qerr||!p?.id) throw qerr||new Error(\"Created Partner could not be found.\");\n          const {error}=await db.rpc(\"admin_set_partner_claim_access\",{p_partner_id:p.id,p_all_branches:all,p_branch_codes:codes});\n          if(error) throw error;\n          if(typeof msg===\"function\") msg(out,`${p.partner_name||code} created successfully with branch access saved.`,true);\n        }catch(err){\n          if(typeof msg===\"function\") msg(out,`Partner created, but branch access could not be saved: ${err?.message||err}`);\n        }\n      };\n    }\n  }\n\n  function compactPartnerCards(){\n    const root=document.getElementById(\"partners\");\n    if(!root) return;\n    [...root.querySelectorAll(\".partner\")].forEach(card=>{\n      if(card.dataset.compactReady) return;\n      card.dataset.compactReady=\"1\";\n      const prow=card.querySelector(\".prow\");\n      const nums=card.querySelector(\".nums\");\n      if(!prow||!nums) return;\n      const extra=document.createElement(\"div\");\n      extra.className=\"partner-extra\";\n      let node=nums.nextElementSibling;\n      while(node){const next=node.nextElementSibling;extra.appendChild(node);node=next}\n      card.appendChild(extra);\n      prow.addEventListener(\"click\",ev=>{\n        if(ev.target.closest(\"button,input,select,a\")) return;\n        card.classList.toggle(\"expanded\");\n      });\n    });\n  }\n\n  function bootEnhancements(){\n    installBranchCreateUI();\n    compactPartnerCards();\n    const root=document.getElementById(\"partners\");\n    if(root) new MutationObserver(compactPartnerCards).observe(root,{childList:true});\n  }\n  if(document.readyState===\"loading\") document.addEventListener(\"DOMContentLoaded\",()=>setTimeout(bootEnhancements,0));\n  else setTimeout(bootEnhancements,0);\n})();\n\n\n(function(){\n  function bootV5(){\n    const modal=document.getElementById(\"createPartnerModal\");\n    const openBtn=document.getElementById(\"createPartnerLauncherBtn\");\n    const closeBtn=document.getElementById(\"createPartnerClose\");\n    if(!modal||!openBtn||!closeBtn) return;\n\n    const open=()=>{modal.classList.add(\"open\");document.body.style.overflow=\"hidden\"};\n    const close=()=>{modal.classList.remove(\"open\");document.body.style.overflow=\"\"};\n\n    openBtn.onclick=open;\n    closeBtn.onclick=close;\n    modal.addEventListener(\"click\",e=>{if(e.target===modal) close();});\n\n    const msg=document.getElementById(\"createPartnerMsg\");\n    if(msg){\n      new MutationObserver(()=>{\n        if(/created successfully/i.test(msg.textContent||\"\")) setTimeout(close,650);\n      }).observe(msg,{childList:true,subtree:true,characterData:true});\n    }\n  }\n  if(document.readyState===\"loading\") document.addEventListener(\"DOMContentLoaded\",bootV5);\n  else bootV5();\n})();\n";
    let transformed=html;
    const addStart='<section class="card">\n<h3>Add New Partner</h3>';
    const allocStart='<section class="card"><h3>Partner Voucher Allocation</h3>';
    const s=transformed.indexOf(addStart);
    const e=transformed.indexOf(allocStart);
    if(s!==-1 && e>s){
      const original=transformed.slice(s,e);
      const body=original
        .replace('<section class="card">\n<h3>Add New Partner</h3>','<section class="create-modal-sheet"><div class="create-modal-head"><h3>Add New Partner</h3><button id="createPartnerClose" type="button">×</button></div>')
        .replace(/<\/section>\s*$/,'</section>');
      const launcher=`<section id="createPartnerLauncherCard" class="card">
        <div class="launcher-copy"><h3>Add New Partner</h3><p class="sub">Create partner + voucher limit + branch permission.</p></div>
        <button id="createPartnerLauncherBtn" type="button">+ Add Partner</button>
      </section>
      <div id="createPartnerModal">${body}</div>
      `;
      transformed=transformed.slice(0,s)+launcher+transformed.slice(e);
    }
    const patched=transformed.replace('</head>',`<style id="modernPremium3D">${modernCSS}</style></head>`).replace('</body>',`<script>${enhancementJS}</scr`+`ipt></body>`);
    document.open();document.write(patched);document.close();
  })
  .catch(err=>{
    document.querySelector('#boot small').textContent=err.message+' — refresh and try again.';
  });
</script>

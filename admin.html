<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d35">
<title>Evolution Optical • Admin Portal</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f9}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#eef3f9;color:#0b1c33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot .box{background:#fff;border-radius:22px;padding:24px 28px;box-shadow:0 18px 40px rgba(24,39,66,.13);text-align:center}
#boot b{display:block;font-size:17px}#boot small{display:block;color:#64748b;margin-top:6px}
</style>
</head>
<body>
<div id="boot"><div class="box"><b>EVOLUTION OPTICAL</b><small>Loading Admin Portal…</small></div></div>
<script>

const FIX="\n(function(){\n  const KEY=\"evolution_admin_hidden_partners_fixed_v1\";\n\n  function readHidden(){\n    try { return JSON.parse(localStorage.getItem(KEY)||\"{}\") || {}; }\n    catch(_) { return {}; }\n  }\n  function saveHidden(x){ localStorage.setItem(KEY, JSON.stringify(x)); }\n\n  function codeOf(card){\n    return String(card?.querySelector(\".pcode,.perf-code\")?.textContent||\"\")\n      .replace(/^Partner:\\s*/i,\"\").trim().toUpperCase();\n  }\n  function nameOf(card){\n    return String(card?.querySelector(\".pname,h4\")?.textContent||\"Partner\").trim();\n  }\n  function esc(s){\n    return String(s||\"\").replace(/[&<>\"']/g,c=>({\n      \"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"\n    }[c]));\n  }\n\n  function applyHidden(){\n    const hidden=readHidden();\n\n    document.querySelectorAll(\"#partners .partner\").forEach(card=>{\n      const code=codeOf(card);\n      if(code && hidden[code]) card.style.setProperty(\"display\",\"none\",\"important\");\n      else card.style.removeProperty(\"display\");\n    });\n\n    document.querySelectorAll(\".perf-card\").forEach(card=>{\n      const code=codeOf(card);\n      if(code && hidden[code]) card.style.setProperty(\"display\",\"none\",\"important\");\n      else card.style.removeProperty(\"display\");\n    });\n\n    const count=document.getElementById(\"hiddenPartnersCount\");\n    if(count) count.textContent=Object.keys(hidden).length;\n  }\n\n  function renderHiddenList(){\n    const box=document.getElementById(\"hiddenPartnersList\");\n    if(!box) return;\n    const hidden=readHidden();\n    const rows=Object.entries(hidden);\n\n    box.innerHTML=rows.length ? rows.map(([code,v])=>`\n      <div class=\"hidden-row\">\n        <div><b>${esc(v.name||\"Partner\")}</b><small>${esc(code)}</small></div>\n        <button type=\"button\" class=\"showPartnerBtn\" data-fixed-code=\"${esc(code)}\">Show Partner</button>\n      </div>\n    `).join(\"\") : `<div class=\"hidden-empty\">No hidden partners.</div>`;\n  }\n\n  document.addEventListener(\"click\",function(e){\n    const hideBtn=e.target.closest(\".hide-partner-btn\");\n    if(hideBtn){\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      const card=hideBtn.closest(\".partner\");\n      const code=codeOf(card);\n      if(!code) return;\n\n      const name=nameOf(card);\n      if(!confirm(`Hide ${name} from this Admin view?`)) return;\n\n      const hidden=readHidden();\n      hidden[code]={name,code};\n      saveHidden(hidden);\n      applyHidden();\n      return;\n    }\n\n    const hiddenBtn=e.target.closest(\"#hiddenPartnersBtn\");\n    if(hiddenBtn){\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      renderHiddenList();\n      const modal=document.getElementById(\"hiddenPartnersModal\");\n      if(modal){\n        modal.classList.add(\"open\");\n        document.body.style.overflow=\"hidden\";\n      }\n      return;\n    }\n\n    const showBtn=e.target.closest(\".showPartnerBtn\");\n    if(showBtn){\n      const code=String(showBtn.dataset.fixedCode||showBtn.dataset.code||\"\").trim().toUpperCase();\n      if(!code) return;\n\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      const hidden=readHidden();\n      delete hidden[code];\n      saveHidden(hidden);\n\n      applyHidden();\n      renderHiddenList();\n      return;\n    }\n  }, true);\n\n  function boot(){\n    applyHidden();\n    setTimeout(applyHidden,300);\n    setTimeout(applyHidden,900);\n    setTimeout(applyHidden,1800);\n\n    let timer;\n    new MutationObserver(()=>{\n      clearTimeout(timer);\n      timer=setTimeout(applyHidden,50);\n    }).observe(document.documentElement,{childList:true,subtree:true});\n  }\n\n  if(document.readyState===\"loading\"){\n    document.addEventListener(\"DOMContentLoaded\",boot);\n  }else{\n    boot();\n  }\n})();\n";
fetch('admin-preview.html?fixed=' + Date.now(), {cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('Unable to load admin-preview.html'); return r.text();})
  .then(src=>{
    const needle='document.open();document.write(patched);document.close();';
    if(!src.includes(needle)) throw new Error('Preview structure changed; patch point not found.');

    const replacement =
      "patched=patched.replace('</body>','<scr'+'ipt>'+FIX+'</scr'+'ipt></body>');" +
      "document.open();document.write(patched);document.close();";

    src = src.replace(needle, replacement);
    document.open();
    document.write(src);
    document.close();
  })
  .catch(err=>{
    document.getElementById('boot').innerHTML =
      '<div style="font:600 16px -apple-system;color:#0b1c33;text-align:center;padding:24px">' +
      String(err.message || err) + '</div>';
  });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical • Admin Staff Limit Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050716;--card:#0b1335;--ink:#f7f8ff;--muted:#bcc7e3;
  --blue:#4f8dff;--green:#20d7a0;--red:#ff5f7a;--line:rgba(115,135,210,.34);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 8% 5%,rgba(192,92,255,.18),transparent 28%),
radial-gradient(circle at 92% 16%,rgba(40,168,255,.15),transparent 30%),
linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:10;padding:calc(17px + env(safe-area-inset-top)) 16px 17px;
background:rgba(5,12,35,.94);border-bottom:1px solid rgba(103,120,255,.28);backdrop-filter:blur(16px)}
.topin{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}
.brand{flex:1}.brand h1{margin:0;font-size:21px;letter-spacing:1px}.brand p{margin:4px 0 0;color:#9fb2dc;font-size:12px}
.wrap{width:min(760px,calc(100% - 18px));margin:14px auto 40px}
.card,.partner{border:1px solid transparent;background:
linear-gradient(145deg,rgba(20,18,69,.96),rgba(7,20,52,.96) 58%,rgba(5,14,38,.97)) padding-box,
linear-gradient(120deg,rgba(225,92,255,.7),rgba(91,103,255,.52),rgba(42,221,240,.44)) border-box;
box-shadow:0 14px 28px rgba(0,0,0,.28);border-radius:20px}
.card{padding:16px;margin-bottom:12px}.partner{padding:14px;margin-top:10px}
h2,h3{margin:0 0 7px}.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.field{margin-top:13px}label{display:block;margin-bottom:6px;color:#d9e3ff;font-size:12px;font-weight:800}
input{width:100%;min-height:48px;padding:11px 13px;border:1px solid rgba(100,128,210,.42);border-radius:14px;
background:linear-gradient(145deg,rgba(15,23,58,.98),rgba(7,15,41,.98));color:#fff;font-size:16px;outline:none}
.btn{min-height:46px;border:1px solid transparent;border-radius:13px;padding:10px 13px;color:#fff;font-weight:900;background:
linear-gradient(145deg,#182665,#0b1b4f) padding-box,
linear-gradient(135deg,#b85cff,#6285ff,#2ee2ee) border-box}
.btn.green{background:linear-gradient(145deg,#0d4a47,#073633) padding-box,linear-gradient(135deg,#58f0ca,#28d3a8,#3fdff0) border-box}
.btn.red{background:linear-gradient(145deg,#5b182b,#39101e) padding-box,linear-gradient(135deg,#ff7391,#ff4e73,#c94cff) border-box}
.btn:disabled{opacity:.5}
.full{width:100%;margin-top:14px}.hidden{display:none!important}
.msg{margin-top:10px;padding:10px 11px;border-radius:11px;font-size:12px}.ok{background:rgba(22,163,102,.15);color:#69efb7}.err{background:rgba(197,47,72,.15);color:#ff92a5}
.prow{display:flex;gap:10px;align-items:flex-start}.info{flex:1;min-width:0}.name{font-weight:900}.code{margin-top:3px;color:#7da9ff;font-size:10px}
.badge{padding:5px 8px;border-radius:999px;background:rgba(31,207,145,.13);color:#58f0bd;font-size:10px;font-weight:900}
.badge.off{background:rgba(255,85,112,.12);color:#ff8297}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}
.metric{padding:9px;border:1px solid rgba(100,128,210,.28);border-radius:12px;background:rgba(9,18,48,.75)}
.metric span{display:block;color:#9eafd2;font-size:9px;font-weight:800}.metric b{display:block;margin-top:3px;font-size:18px}
.control{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}.control input{min-height:44px}.control .btn{min-width:115px}
.search{margin-top:12px}
.ghost{border:1px solid rgba(255,255,255,.18);background:#ffffff0b;color:#fff;border-radius:12px;padding:9px 11px;font-weight:800}
@media(max-width:450px){.control{grid-template-columns:1fr}.control .btn{width:100%}}
</style>
</head>
<body>
<header class="top">
<div class="topin">
  <div class="brand"><h1>EVOLUTION OPTICAL</h1><p>Admin • Partner Staff Limit Test</p></div>
  <button id="logoutBtn" class="ghost hidden">Logout</button>
</div>
</header>

<main class="wrap">
<section id="loginCard" class="card">
  <h2>Admin Login</h2>
  <p class="sub">Only an authorised Evolution Optical Admin can change Partner Staff limits.</p>
  <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn full">SIGN IN</button>
  <div id="loginMsg" class="msg hidden"></div>
</section>

<section id="app" class="hidden">
  <section class="card">
    <h2>Partner Staff Limits</h2>
    <p class="sub">Set how many Partner Staff accounts each Partner may keep active. This does not change Voucher Limit.</p>
    <input id="search" class="search" placeholder="Search Partner name or code">
    <div id="pageMsg" class="msg hidden"></div>
  </section>
  <div id="list"></div>
</section>
</main>

<script>
const SUPABASE_URL="https://hukihbcyyqhanaqrizvm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_kpPFeGYpedq2auo01Zo50A_aiSjdeVh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let partners=[];
let staffCounts={};

function showMsg(node,text,ok=false){
  if(!text){node.className="msg hidden";node.textContent="";return}
  node.textContent=text;node.className="msg "+(ok?"ok":"err");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function login(){
  showMsg($("loginMsg"),"");$("loginBtn").disabled=true;
  try{
    const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
    if(error){showMsg($("loginMsg"),error.message);return}
    await authorize();
  }finally{$("loginBtn").disabled=false}
}

async function authorize(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){showLogin();return}
  const {data,error}=await db.from("partner_users").select("role,status").eq("user_id",user.id).eq("status","active").maybeSingle();
  if(error||!data||String(data.role).toLowerCase()!=="admin"){
    await db.auth.signOut();showLogin();showMsg($("loginMsg"),"This account is not authorised as Admin.");return;
  }
  $("loginCard").classList.add("hidden");$("app").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");
  await loadData();
}

function showLogin(){
  $("loginCard").classList.remove("hidden");$("app").classList.add("hidden");$("logoutBtn").classList.add("hidden");
}

async function loadData(){
  showMsg($("pageMsg"),"");
  const [pRes,uRes]=await Promise.all([
    db.from("partners").select("id,partner_code,partner_name,status,staff_limit,staff_access_enabled").order("partner_name"),
    db.from("partner_users").select("partner_id,status,removed_at").eq("role","partner_staff")
  ]);
  if(pRes.error){showMsg($("pageMsg"),"Unable to load Partners: "+pRes.error.message);return}
  if(uRes.error){showMsg($("pageMsg"),"Unable to load Partner Staff: "+uRes.error.message);return}

  partners=(pRes.data||[]).filter(p=>String(p.partner_code||"").toUpperCase()!=="ADMIN");
  staffCounts={};
  (uRes.data||[]).forEach(u=>{
    if(u.removed_at||String(u.status).toLowerCase()==="inactive")return;
    staffCounts[u.partner_id]=(staffCounts[u.partner_id]||0)+1;
  });
  render();
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const list=partners.filter(p=>!q||`${p.partner_name} ${p.partner_code}`.toLowerCase().includes(q));
  $("list").innerHTML=list.length?list.map(p=>{
    const used=staffCounts[p.id]||0;
    const limit=Number(p.staff_limit||0);
    const active=String(p.status||"").toLowerCase()==="active";
    return `<section class="partner">
      <div class="prow">
        <div class="info">
          <div class="name">${esc(p.partner_name)}</div>
          <div class="code">${esc(p.partner_code)}</div>
        </div>
        <span class="badge ${active?"":"off"}">${esc(String(p.status||"").toUpperCase())}</span>
      </div>
      <div class="metrics">
        <div class="metric"><span>PARTNER STAFF</span><b>${used} / ${limit}</b></div>
        <div class="metric"><span>STAFF ACCESS</span><b>${p.staff_access_enabled?"ON":"OFF"}</b></div>
      </div>
      <div class="control">
        <input id="limit-${p.id}" type="number" min="0" max="1000" step="1" value="${limit}" aria-label="Staff limit">
        <button id="btn-${p.id}" class="btn green" onclick="setLimit('${p.id}')">SET LIMIT</button>
      </div>
      <div id="msg-${p.id}" class="msg hidden"></div>
    </section>`;
  }).join(""):'<section class="card"><p class="sub">No Partner found.</p></section>';
}

async function setLimit(id){
  const p=partners.find(x=>String(x.id)===String(id));if(!p)return;
  const input=$("limit-"+id),out=$("msg-"+id),btn=$("btn-"+id);
  const n=Number(input.value);
  showMsg(out,"");
  if(!Number.isInteger(n)||n<0||n>1000){showMsg(out,"Staff Limit must be a whole number from 0 to 1000.");return}

  const current=staffCounts[id]||0;
  let warning="";
  if(n<current)warning=`\n\nThis Partner currently has ${current} Staff. Existing Staff will NOT be deleted or suspended; the Partner simply cannot add new Staff until the active count is within the new limit.`;
  if(!confirm(`Set ${p.partner_name} Staff Limit to ${n}?${warning}`))return;

  btn.disabled=true;btn.textContent="SAVING…";
  try{
    const {data,error}=await db.functions.invoke("admin-set-partner-staff-limit",{body:{partner_id:id,staff_limit:n}});
    if(error){
      let detail=error.message||"Update failed.";
      try{
        if(error.context&&typeof error.context.json==="function"){
          const body=await error.context.json();
          if(body?.error)detail=body.error;
        }
      }catch(_){}
      throw new Error(detail);
    }
    if(data?.success===false)throw new Error(data.error||"Update failed.");
    showMsg(out,`Staff Limit updated to ${n}.`,true);
    p.staff_limit=n;
    setTimeout(render,650);
  }catch(e){showMsg(out,e.message||"Update failed.")}
  finally{btn.disabled=false;btn.textContent="SET LIMIT"}
}

$("loginBtn").onclick=login;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("search").addEventListener("input",render);
$("logoutBtn").onclick=async()=>{await db.auth.signOut();showLogin()};

(async()=>{
  const {data}=await db.auth.getSession();
  if(data?.session)await authorize();else showLogin();
})();
</script>
</body>
</html>

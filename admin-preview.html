<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d35">
<title>Evolution Optical • Admin Modern Preview</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 80% 0%,rgba(96,165,250,.15),transparent 30%),#eef3f9}
#boot .box{background:linear-gradient(145deg,#fff,#f2f6fb);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:24px 28px;text-align:center;box-shadow:0 22px 48px rgba(24,39,66,.14),0 7px 16px rgba(26,50,86,.07),inset 0 1px 0 rgba(255,255,255,.85)}
#boot b{display:block;font-size:16px}#boot small{display:block;color:#64748b;margin-top:5px}
</style>
</head>
<body>
<div id="boot"><div class="box"><b>EVOLUTION OPTICAL</b><small>Loading Admin Preview…</small></div></div>
<script>
const modernCSS=`
:root{--bg:#eef3f9!important;--card:rgba(255,255,255,.94)!important;--ink:#0b1220!important;--muted:#64748b!important;--navy:#0a1d35!important;--line:#e3eaf2!important;--blue:#2563eb!important;--green:#15803d!important;--greenbg:#ecfdf3!important;--red:#dc2626!important;--redbg:#fef2f2!important}
html,body{background:radial-gradient(circle at 86% 0%,rgba(73,137,255,.14),transparent 30%),radial-gradient(circle at 10% 20%,rgba(59,130,246,.06),transparent 28%),#eef3f9!important}
.top{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 55%),linear-gradient(135deg,#08192f,#0e2b4e)!important;box-shadow:0 12px 30px rgba(5,24,48,.20),inset 0 -1px 0 rgba(255,255,255,.06)!important;padding-top:calc(18px + env(safe-area-inset-top))!important;padding-bottom:18px!important}
.topin{max-width:1080px!important}.brand h1{letter-spacing:.8px!important;font-weight:900!important}.brand p{color:#a9c8e8!important}.ghost{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05))!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 18px rgba(0,0,0,.10)!important}
.wrap{width:min(1080px,calc(100% - 24px))!important;margin-top:20px!important}.card{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(244,248,252,.94))!important;border:1px solid rgba(255,255,255,.92)!important;border-radius:22px!important;box-shadow:0 20px 42px rgba(31,52,82,.11),0 7px 16px rgba(31,52,82,.055),inset 0 1px 0 rgba(255,255,255,.9)!important;backdrop-filter:blur(14px)!important}
h2,h3{color:#0b1c33!important;letter-spacing:-.2px}.sub{color:#68778b!important}input,select{background:linear-gradient(145deg,#fff,#f8fafc)!important;border:1px solid #dbe4ee!important;box-shadow:inset 2px 2px 6px rgba(58,78,106,.045),inset -2px -2px 6px rgba(255,255,255,.95)!important;outline:none!important;transition:.15s ease!important}input:focus,select:focus{border-color:#7ba8f7!important;box-shadow:0 0 0 4px rgba(37,99,235,.10),inset 1px 1px 4px rgba(58,78,106,.04)!important}
.btn{background:linear-gradient(145deg,#112842,#081a2f)!important;box-shadow:0 9px 18px rgba(8,26,47,.18),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.12)!important;transition:transform .12s ease,box-shadow .12s ease!important}.btn:active{transform:translateY(1px)!important}.btn.blue{background:linear-gradient(145deg,#4b82ff,#2459e6)!important;box-shadow:0 9px 18px rgba(37,99,235,.23),inset 0 1px 0 rgba(255,255,255,.35)!important}.btn.green{background:linear-gradient(145deg,#20a758,#13783f)!important;box-shadow:0 9px 18px rgba(21,128,61,.20),inset 0 1px 0 rgba(255,255,255,.28)!important}.btn.red{background:linear-gradient(145deg,#ef5252,#ba1f1f)!important;box-shadow:0 9px 18px rgba(220,38,38,.18),inset 0 1px 0 rgba(255,255,255,.22)!important}
.stat,.vstat{position:relative!important;overflow:hidden!important;background:linear-gradient(145deg,#fff,#f2f7fc)!important;border:1px solid rgba(255,255,255,.95)!important;box-shadow:8px 8px 18px rgba(72,95,128,.09),-5px -5px 14px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,.95)!important}.stat:before,.vstat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#60a5fa,#2563eb);border-radius:4px}
.partner,.perf-card,.vrecord,.claim-panel{background:linear-gradient(145deg,#fff,#f5f8fc)!important;border:1px solid #e3eaf2!important;box-shadow:0 11px 24px rgba(37,57,87,.075),inset 0 1px 0 rgba(255,255,255,.9)!important}.num,.pm,.claim-summary{background:linear-gradient(145deg,#fbfdff,#eef4fa)!important}.claim-option{background:linear-gradient(145deg,#fff,#f8fbff)!important;border-color:#e0e8f1!important;box-shadow:0 5px 12px rgba(40,62,93,.045)!important}
#loginCard{max-width:520px!important;margin:6vh auto 0!important}#loginCard h2,#loginCard .sub{text-align:center!important}
@media(max-width:620px){.wrap{width:min(100% - 14px,1080px)!important;margin-top:9px!important}.card{padding:14px!important;border-radius:18px!important;margin-bottom:10px!important;box-shadow:0 11px 24px rgba(31,52,82,.09),inset 0 1px 0 rgba(255,255,255,.88)!important}.top{padding-left:12px!important;padding-right:12px!important}.brand h1{font-size:18px!important}.brand p{font-size:11px!important}.stats{gap:7px!important}.partner{padding:12px!important}.actions{gap:7px!important}.btn.small{min-height:40px!important}}


/* Compact partner layout + integrated create-partner branch selection */
#partners{
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:14px!important;
  align-items:start!important;
}
#partners .partner{
  margin-top:0!important;
  height:100%!important;
}
#partners .actions{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
}
#partners .actions input{
  grid-column:1/-1!important;
}
#partners .actions .btn{
  width:100%!important;
}
#partners .actions .btn:last-child{
  grid-column:1/-1!important;
}
.create-grid .wide{
  background:linear-gradient(145deg,#fbfdff,#f3f7fc)!important;
  border:1px solid #e1e8f1!important;
  border-radius:16px!important;
  padding:13px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 7px 18px rgba(38,58,88,.045)!important;
}
.create-grid .wide > label:first-child{
  color:#15304f!important;
  font-size:13px!important;
}
#newPartnerClaimBranches{
  margin-top:9px!important;
}
#newPartnerAllBranches + span small{
  color:#718096!important;
}
@media(max-width:720px){
  #partners{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:10px!important;
  }
  #partners .partner{
    padding:11px!important;
  }
  #partners .pname{
    font-size:14px!important;
    line-height:1.2!important;
  }
  #partners .pcode{
    font-size:10px!important;
  }
  #partners .nums{
    gap:5px!important;
  }
  #partners .num{
    padding:7px!important;
  }
  #partners .num span{
    font-size:9px!important;
  }
  #partners .num b{
    font-size:15px!important;
  }
  #partners .actions{
    grid-template-columns:1fr!important;
  }
  #partners .actions input,
  #partners .actions .btn,
  #partners .actions .btn:last-child{
    grid-column:1!important;
  }
  #partners .btn.small{
    font-size:11px!important;
    min-height:36px!important;
    padding:8px 7px!important;
  }
  #partners .claim-summary{
    font-size:10px!important;
    line-height:1.35!important;
    padding:8px!important;
  }
}
@media(max-width:470px){
  #partners{
    grid-template-columns:1fr!important;
  }
}


/* V3: genuinely compact mobile admin */
@media(max-width:720px){
  .create-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:9px!important;
  }
  .create-grid .field{margin:0!important;min-width:0!important}
  .create-grid .field label{font-size:11px!important;margin-bottom:5px!important}
  .create-grid input,.create-grid select{min-height:44px!important;padding:10px!important;font-size:14px!important}
  .create-grid .wide{grid-column:1/-1!important}
  .create-actions{margin-top:10px!important}
  .create-actions .btn{min-height:46px!important}
  #newPartnerBranchBox{grid-column:1/-1!important}
  #partners{grid-template-columns:1fr!important}
  #partners .partner{height:auto!important}
  #partners .partner .partner-extra{display:none}
  #partners .partner.expanded .partner-extra{display:block}
  #partners .partner .prow{cursor:pointer;align-items:center!important}
  #partners .partner .prow:after{
    content:"⌄";font-size:18px;color:#64748b;margin-left:5px;transition:.18s transform
  }
  #partners .partner.expanded .prow:after{transform:rotate(180deg)}
  #partners .nums{margin-top:8px!important}
  #partners .num{padding:8px!important}
}
@media(min-width:721px){
  #partners{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
#newPartnerBranchBox{
  background:linear-gradient(145deg,#fbfdff,#f1f6fc)!important;
  border:1px solid #dde7f2!important;border-radius:16px!important;padding:12px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 7px 16px rgba(39,60,91,.05)!important
}
#newPartnerBranchBox .branch-title{font-weight:800;font-size:12px;color:#17314f;margin-bottom:8px}
#newPartnerBranchBox .branch-all{display:flex;gap:8px;align-items:flex-start;font-size:12px}
#newPartnerBranchList{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
#newPartnerBranchList label{display:flex;gap:6px;align-items:flex-start;padding:8px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;font-size:11px}
#newPartnerBranchBox input[type=checkbox]{width:17px!important;height:17px!important;min-height:0!important;flex:0 0 auto}
`;
fetch('admin.html?preview=' + Date.now(), {cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('Unable to load admin.html'); return r.text();})
  .then(html=>{
    const enhancementJS="\n(function(){\n  function esc2(s){return String(s??\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]))}\n\n  function installBranchCreateUI(){\n    const limit=document.getElementById(\"newPartnerLimit\");\n    const grid=limit?.closest(\".create-grid\");\n    if(!grid || document.getElementById(\"newPartnerBranchBox\")) return;\n\n    const box=document.createElement(\"div\");\n    box.id=\"newPartnerBranchBox\";\n    box.className=\"field wide\";\n    box.innerHTML=`<div class=\"branch-title\">Voucher Claim Branch Permission</div>\n      <label class=\"branch-all\"><input id=\"newPartnerAllBranches\" type=\"checkbox\" checked>\n        <span><b>All Evolution Optical branches</b><br><small style=\"color:#718096\">Or untick to select specific branches.</small></span>\n      </label>\n      <div id=\"newPartnerBranchList\"></div>`;\n    grid.appendChild(box);\n\n    const render=()=>{\n      const all=document.getElementById(\"newPartnerAllBranches\");\n      const list=document.getElementById(\"newPartnerBranchList\");\n      if(!list) return;\n      const rows=(typeof branches!==\"undefined\" && Array.isArray(branches)?branches:[])\n        .filter(b=>String(b.status||\"active\").toLowerCase()===\"active\");\n      list.innerHTML=rows.length?rows.map(b=>`<label><input class=\"newPartnerBranchCheck\" type=\"checkbox\" value=\"${esc2(b.branch_code)}\" ${all?.checked?\"disabled\":\"\"}><span>${esc2(String(b.branch_name||b.branch_code).replace(/\\s*\\(HQ\\)\\s*/gi,\" \").trim())}</span></label>`).join(\"\")\n        :`<small style=\"color:#718096\">Branches will appear after dashboard data finishes loading.</small>`;\n    };\n    box.querySelector(\"#newPartnerAllBranches\").onchange=e=>{\n      box.querySelectorAll(\".newPartnerBranchCheck\").forEach(x=>x.disabled=e.target.checked);\n    };\n    render();\n    setTimeout(render,700);setTimeout(render,1800);\n\n    const btn=document.getElementById(\"createPartnerBtn\");\n    if(btn && !btn.dataset.branchWrapped){\n      btn.dataset.branchWrapped=\"1\";\n      const original=btn.onclick;\n      btn.onclick=async function(e){\n        const code=(document.getElementById(\"newPartnerCode\")?.value||\"\").trim().toUpperCase();\n        const all=document.getElementById(\"newPartnerAllBranches\")?.checked!==false;\n        const codes=[...document.querySelectorAll(\".newPartnerBranchCheck:checked\")].map(x=>x.value);\n        if(!all && !codes.length){\n          const out=document.getElementById(\"createPartnerMsg\");\n          if(typeof msg===\"function\" && out) msg(out,\"Please select at least one branch, or choose All Evolution Optical branches.\");\n          return;\n        }\n        if(original) await original.call(this,e);\n        const out=document.getElementById(\"createPartnerMsg\");\n        if(!code || !out || !/created successfully/i.test(out.textContent||\"\")) return;\n        try{\n          const {data:p,error:qerr}=await db.from(\"partners\").select(\"id,partner_name\").eq(\"partner_code\",code).maybeSingle();\n          if(qerr||!p?.id) throw qerr||new Error(\"Created Partner could not be found.\");\n          const {error}=await db.rpc(\"admin_set_partner_claim_access\",{p_partner_id:p.id,p_all_branches:all,p_branch_codes:codes});\n          if(error) throw error;\n          if(typeof msg===\"function\") msg(out,`${p.partner_name||code} created successfully with branch access saved.`,true);\n        }catch(err){\n          if(typeof msg===\"function\") msg(out,`Partner created, but branch access could not be saved: ${err?.message||err}`);\n        }\n      };\n    }\n  }\n\n  function compactPartnerCards(){\n    const root=document.getElementById(\"partners\");\n    if(!root) return;\n    [...root.querySelectorAll(\".partner\")].forEach(card=>{\n      if(card.dataset.compactReady) return;\n      card.dataset.compactReady=\"1\";\n      const prow=card.querySelector(\".prow\");\n      const nums=card.querySelector(\".nums\");\n      if(!prow||!nums) return;\n      const extra=document.createElement(\"div\");\n      extra.className=\"partner-extra\";\n      let node=nums.nextElementSibling;\n      while(node){const next=node.nextElementSibling;extra.appendChild(node);node=next}\n      card.appendChild(extra);\n      prow.addEventListener(\"click\",ev=>{\n        if(ev.target.closest(\"button,input,select,a\")) return;\n        card.classList.toggle(\"expanded\");\n      });\n    });\n  }\n\n  function bootEnhancements(){\n    installBranchCreateUI();\n    compactPartnerCards();\n    const root=document.getElementById(\"partners\");\n    if(root) new MutationObserver(compactPartnerCards).observe(root,{childList:true});\n  }\n  if(document.readyState===\"loading\") document.addEventListener(\"DOMContentLoaded\",()=>setTimeout(bootEnhancements,0));\n  else setTimeout(bootEnhancements,0);\n})();\n";
    const patched=html.replace('</head>',`<style id="modernPremium3D">${modernCSS}</style></head>`).replace('</body>',`<script>${enhancementJS}</scr`+`ipt></body>`);
    document.open();document.write(patched);document.close();
  })
  .catch(err=>{
    document.querySelector('#boot small').textContent=err.message+' — refresh and try again.';
  });
</script>
</body>
</html>

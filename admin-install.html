<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08122f">
  <title>Admin</title>

  <link rel="manifest" href="manifest-admin.json">
  <link rel="apple-touch-icon" sizes="180x180" href="admin-icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Admin">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#06122b,#0b1d46);color:#fff}
    main{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}
    .card{width:min(420px,100%);text-align:center;padding:28px;border:1px solid rgba(255,255,255,.14);
      border-radius:24px;background:rgba(255,255,255,.06);box-shadow:0 18px 60px rgba(0,0,0,.28)}
    img{width:112px;height:112px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
    h1{margin:18px 0 8px;font-size:28px}
    p{margin:0;color:#cbd5e1;line-height:1.55}
    .btn{display:block;margin-top:22px;padding:14px 18px;border-radius:14px;
      background:linear-gradient(135deg,#6756ff,#1aa7ff);color:#fff;text-decoration:none;font-weight:800}
  </style>

  <script>
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      location.replace('admin.html');
    }
  </script>
</head>
<body>
  <main>
    <div class="card">
      <img src="admin-icon-180.png" alt="Admin">
      <h1>Admin</h1>
      <p>Use Share → Add to Home Screen. After installation, tapping the icon opens the Admin portal.</p>
      <a class="btn" href="admin.html">Open Admin</a>
    </div>
  </main>
</body>
</html>

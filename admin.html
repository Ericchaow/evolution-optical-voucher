<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical • Admin Portal</title>
<style>
html,body{margin:0;min-height:100%;background:#050716;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
#boot .box{max-width:560px}
#boot h2{margin:0 0 8px}#boot p{color:#b9c6e4;line-height:1.55}
</style>
</head>
<body>
<div id="boot"><div class="box"><h2>EVOLUTION OPTICAL</h2><p>Loading Admin Portal v4…</p></div></div>
<script>

(async function(){
  const boot=document.getElementById("boot");
  try{
    const res=await fetch("https://raw.githubusercontent.com/xiaoe-ai/evolution-optical-voucher/7413a17d2133a16b566c5e4eaddade32b0b73145/admin.html",{cache:"no-store"});
    if(!res.ok)throw new Error("Unable to load Admin base: HTTP "+res.status);
    let html=await res.text();

    function swap(find,repl,label){
      if(!html.includes(find))throw new Error("Merge point not found: "+label);
      html=html.replace(find,repl);
    }

    swap(
`      <div class="field wide"><label>Initial Voucher Limit</label><input id="newPartnerLimit" type="number" min="0" step="1" value="100"></div>`,
`      <div class="field wide"><label>Initial Voucher Limit</label><input id="newPartnerLimit" type="number" min="0" step="1" value="100"></div>
      <div class="field wide">
        <label>Partner Staff Limit</label>
        <input id="newPartnerStaffLimit" type="number" min="0" max="1000" step="1" value="0" placeholder="e.g. 5">
        <div class="note">Maximum Partner Staff accounts allowed for this Partner.</div>
      </div>`,
"new partner field");

    swap(
`.select("id,partner_code,partner_name,voucher_limit,vouchers_issued,status")`,
`.select("id,partner_code,partner_name,voucher_limit,vouchers_issued,status,staff_limit,staff_access_enabled")`,
"partner query");

    swap(
`        <div id="claim-summary-\${p.id}" class="claim-summary">Claim: loading…</div>`,
`        <div class="claim-summary" style="margin-top:8px">
          <b>Partner Staff:</b> Limit \${Number(p.staff_limit||0)} · Staff Access \${p.staff_access_enabled?"ON":"OFF"}
        </div>
        <div class="actions" style="margin-top:7px">
          <input id="staff-limit-\${p.id}" type="number" min="0" max="1000" step="1" value="\${Number(p.staff_limit||0)}" placeholder="Partner Staff Limit">
          <button class="btn small green wide" onclick="setPartnerStaffLimit('\${p.id}')">Set Staff Limit</button>
        </div>
        <div id="staff-limit-msg-\${p.id}"></div>
        <div id="claim-summary-\${p.id}" class="claim-summary">Claim: loading…</div>`,
"partner manage controls");

    swap(
`  const voucher_limit=Number($("newPartnerLimit").value);
  const claim_all=$("newPartnerAllBranches").checked;`,
`  const voucher_limit=Number($("newPartnerLimit").value);
  const staff_limit=Number($("newPartnerStaffLimit").value);
  const claim_all=$("newPartnerAllBranches").checked;`,
"create read");

    swap(
`  if(!Number.isInteger(voucher_limit)||voucher_limit<0){
    msg(out,"Voucher Limit must be a whole number of 0 or more.");return
  }
  if(!claim_all&&!claim_codes.length){`,
`  if(!Number.isInteger(voucher_limit)||voucher_limit<0){
    msg(out,"Voucher Limit must be a whole number of 0 or more.");return
  }
  if(!Number.isInteger(staff_limit)||staff_limit<0||staff_limit>1000){
    msg(out,"Partner Staff Limit must be a whole number from 0 to 1000.");return
  }
  if(!claim_all&&!claim_codes.length){`,
"create validation");

    swap(
`    if(createdId){
      await savePartnerClaimAccess(createdId,claim_all,claim_codes);
    }`,
`    if(createdId){
      await savePartnerClaimAccess(createdId,claim_all,claim_codes);
      const {data:slData,error:slError}=await db.functions.invoke("admin-set-partner-staff-limit",{
        body:{partner_id:createdId,staff_limit}
      });
      if(slError||slData?.success===false){
        throw new Error(slData?.error||slError?.message||"Partner created, but Staff Limit could not be saved.");
      }
    }`,
"create save");

    swap(
`    $("newPartnerLimit").value="100";
    $("newPartnerAllBranches").checked=true;`,
`    $("newPartnerLimit").value="100";
    $("newPartnerStaffLimit").value="0";
    $("newPartnerAllBranches").checked=true;`,
"reset field");

    swap(
`async function setLimit(id){`,
`async function setPartnerStaffLimit(id){
  const p=partners.find(x=>String(x.id)===String(id));
  const input=$("staff-limit-"+id);
  const out=$("staff-limit-msg-"+id);
  if(!p||!input)return;

  const n=Number(input.value);
  if(!Number.isInteger(n)||n<0||n>1000){
    msg(out,"Staff Limit must be a whole number from 0 to 1000.");
    return;
  }

  if(!confirm(\`Set \${p.partner_name} Partner Staff Limit to \${n}?\`))return;

  const {data,error}=await db.functions.invoke("admin-set-partner-staff-limit",{
    body:{partner_id:p.id,staff_limit:n}
  });

  if(error||data?.success===false){
    msg(out,data?.error||error?.message||"Staff Limit update failed.");
    return;
  }

  msg(out,\`Partner Staff Limit updated to \${n}.\`,true);
  await loadPartners();
}

async function setLimit(id){`,
"setter");

    html=html.replace("</head>",'<meta name="eo-admin-build" content="staff-limit-v3">\n</head>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    if(boot)boot.innerHTML='<div class="box"><h2>Admin update could not load</h2><p>'+String(e.message||e)+'</p><p>Please send this screen to 小E.</p></div>';
  }
})();

</script>
</body>
</html>

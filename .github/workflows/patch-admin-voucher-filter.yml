name: Patch Admin Voucher Filter

on:
  push:
    paths:
      - '.github/workflows/patch-admin-voucher-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin voucher records UX
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('<meta name="eo-admin-build" content="multi-voucher-full-integration-v1">',
             '<meta name="eo-admin-build" content="multi-voucher-partner-filter-v1">'),

            ('<select id="voucherPartner"><option value="ALL">All Partners</option></select>',
             '<select id="voucherPartner"><option value="SELECT">Select Partner</option></select>'),

            ('const vp=$("voucherPartner"),current=vp.value||"ALL";vp.innerHTML=\'<option value="ALL">All Partners</option>\'+partners.filter(p=>partnerCode(p)!=="LEGACY").map(p=>`<option value="${esc(p.id)}">${esc(p.partner_name)}</option>`).join("");vp.value=[...vp.options].some(o=>o.value===current)?current:"ALL";',
             'const vp=$("voucherPartner"),current=vp.value||"SELECT";vp.innerHTML=\'<option value="SELECT">Select Partner</option>\'+partners.filter(p=>partnerCode(p)!=="LEGACY"&&String(p.status).toLowerCase()==="active").map(p=>`<option value="${esc(p.id)}">${esc(p.partner_name)}</option>`).join("");vp.value=[...vp.options].some(o=>o.value===current)?current:"SELECT";'),

            ('function visibleVoucherRecords(){return vouchers.filter(v=>!isExpiredUnclaimed(v))}',
             'function visibleVoucherRecords(){return vouchers.filter(v=>!isExpiredUnclaimed(v)&&String(v.status||"").toUpperCase()!=="CANCELLED")}' ),

            ('(pf==="ALL"||pid===pf)',
             '((pf==="SELECT"&&!!q)||(pf!=="SELECT"&&pid===pf))'),

            ('function renderVouchers(){const list=filteredVouchers();',
             'function renderVouchers(){const q=$("voucherSearch").value.trim(),pf=$("voucherPartner").value;if(pf==="SELECT"&&!q){$("voucherRecords").innerHTML=\'<div class="sub" style="padding:24px 4px;text-align:center">Select a Partner to view vouchers.</div>\';$("vTotal").textContent="0";$("vValid").textContent="0";$("vRedeemed").textContent="0";$("vExpired").textContent="0";return}const list=filteredVouchers();'),

            ('$("voucherPartner").value="ALL";',
             '$("voucherPartner").value="SELECT";'),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected pattern not found: {old[:120]}')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Admin vouchers: require Partner selection"
          git push
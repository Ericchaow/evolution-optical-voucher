<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d35">
<title>Evolution Optical • Admin Portal</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#0b1c33}
</style>
</head>
<body>
<div id="boot">Loading Admin Portal…</div>
<script>
const FIX = '\n(function(){\n  const KEY="evolution_admin_hidden_partners_fixed_v1";\n\n  function readHidden(){\n    try { return JSON.parse(localStorage.getItem(KEY)||"{}") || {}; }\n    catch(_) { return {}; }\n  }\n  function saveHidden(x){ localStorage.setItem(KEY, JSON.stringify(x)); }\n\n  function codeOf(card){\n    return String(card?.querySelector(".pcode,.perf-code")?.textContent||"")\n      .replace(/^Partner:\\s*/i,"").trim().toUpperCase();\n  }\n  function nameOf(card){\n    return String(card?.querySelector(".pname,h4")?.textContent||"Partner").trim();\n  }\n  function esc(s){\n    return String(s||"").replace(/[&<>"\']/g,c=>({\n      "&":"&amp;","<":"&lt;",">":"&gt;",\'"\':"&quot;","\'":"&#39;"\n    }[c]));\n  }\n\n  function applyHidden(){\n    const hidden=readHidden();\n\n    document.querySelectorAll("#partners .partner").forEach(card=>{\n      const code=codeOf(card);\n      const isHidden=!!(code && hidden[code]);\n      if(isHidden) card.style.setProperty("display","none","important");\n      else card.style.removeProperty("display");\n    });\n\n    document.querySelectorAll(".perf-card").forEach(card=>{\n      const code=codeOf(card);\n      const isHidden=!!(code && hidden[code]);\n      if(isHidden) card.style.setProperty("display","none","important");\n      else card.style.removeProperty("display");\n    });\n\n    const count=document.getElementById("hiddenPartnersCount");\n    if(count) count.textContent=Object.keys(hidden).length;\n  }\n\n  function renderHiddenList(){\n    const box=document.getElementById("hiddenPartnersList");\n    if(!box) return;\n\n    const hidden=readHidden();\n    const rows=Object.entries(hidden);\n\n    box.innerHTML=rows.length ? rows.map(([code,v])=>`\n      <div class="hidden-row">\n        <div><b>${esc(v.name||"Partner")}</b><small>${esc(code)}</small></div>\n        <button type="button" class="showPartnerBtn" data-fixed-code="${esc(code)}">Show Partner</button>\n      </div>\n    `).join("") : `<div class="hidden-empty">No hidden partners.</div>`;\n  }\n\n  document.addEventListener("click",function(e){\n    const hideBtn=e.target.closest(".hide-partner-btn");\n    if(hideBtn){\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      const card=hideBtn.closest(".partner");\n      const code=codeOf(card);\n      if(!code) return;\n\n      const name=nameOf(card);\n      if(!confirm(`Hide ${name} from this Admin view?`)) return;\n\n      const hidden=readHidden();\n      hidden[code]={name,code};\n      saveHidden(hidden);\n      applyHidden();\n      return;\n    }\n\n    const hiddenBtn=e.target.closest("#hiddenPartnersBtn");\n    if(hiddenBtn){\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      renderHiddenList();\n      const modal=document.getElementById("hiddenPartnersModal");\n      if(modal){\n        modal.classList.add("open");\n        document.body.style.overflow="hidden";\n      }\n      return;\n    }\n\n    const showBtn=e.target.closest(".showPartnerBtn");\n    if(showBtn){\n      const code=String(showBtn.dataset.fixedCode||showBtn.dataset.code||"").trim().toUpperCase();\n      if(!code) return;\n\n      e.preventDefault();\n      e.stopPropagation();\n      e.stopImmediatePropagation();\n\n      const hidden=readHidden();\n      delete hidden[code];\n      saveHidden(hidden);\n\n      applyHidden();\n      renderHiddenList();\n      return;\n    }\n  },true);\n\n  function bootFixedHide(){\n    applyHidden();\n    setTimeout(applyHidden,300);\n    setTimeout(applyHidden,900);\n    setTimeout(applyHidden,1800);\n\n    const root=document.body;\n    if(root){\n      let timer;\n      new MutationObserver(()=>{\n        clearTimeout(timer);\n        timer=setTimeout(applyHidden,40);\n      }).observe(root,{childList:true,subtree:true});\n    }\n  }\n\n  if(document.readyState==="loading")\n    document.addEventListener("DOMContentLoaded",bootFixedHide);\n  else\n    bootFixedHide();\n})();\n';
fetch('admin-ui-base.html?hidefix=' + Date.now(), {cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('Unable to load admin.html'); return r.text();})
  .then(src=>{
    const needle='document.open();document.write(patched);document.close();';
    if(!src.includes(needle)) throw new Error('admin.html structure changed; patch point not found.');
    const injected=`const patchedWithHideFix=patched.replace('</body>','<script>'+FIX.replace(/<\\/script>/gi,'<\\\\/script>')+'<\\/script></body>');document.open();document.write(patchedWithHideFix);document.close();`;
    src=src.replace(needle,injected);
    document.open();
    document.write(src);
    document.close();
  })
  .catch(err=>{document.getElementById('boot').textContent=err.message;});
</script>
</body>
</html>

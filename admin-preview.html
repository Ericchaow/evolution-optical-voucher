/* V8 — compact Manage + vouchers grouped inside Partner Performance */
#partners .partner-extra{display:none!important}
#partners .partner.manage-open .partner-extra{display:block!important}
.partner-manage-toggle,.partner-vouchers-toggle{
  width:100%;border:0;border-radius:12px;padding:10px 12px;margin-top:9px;
  font:900 12px/1.2 inherit;cursor:pointer;
  background:linear-gradient(145deg,#edf4ff,#dfeaff);color:#114aa8;
  box-shadow:0 6px 12px rgba(36,73,132,.10),inset 0 1px 0 #fff
}
.partner-manage-toggle:after,.partner-vouchers-toggle:after{content:"  ▼";font-size:10px}
.manage-open>.partner-manage-toggle:after,.vouchers-open>.partner-vouchers-toggle:after{content:"  ▲"}

.partner-vouchers-wrap{display:none;margin-top:9px}
.perf-card.vouchers-open .partner-vouchers-wrap{display:block}
.partner-voucher-item{
  padding:9px;margin-top:6px;border:1px solid #dce7f4;border-radius:12px;
  background:linear-gradient(145deg,#fff,#f1f6fc);
  box-shadow:0 5px 11px rgba(42,66,103,.06),inset 0 1px 0 #fff;
  font-size:11px;line-height:1.4
}
.partner-voucher-item b{font-size:12px}
.partner-voucher-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:5px;color:#536681}
.partner-voucher-empty{padding:10px;text-align:center;color:#718096;font-size:11px}

/* Hide original standalone voucher records visually; data/rendering remain in DOM */
#vouchersSection.v8-hidden-vouchers,
.v8-hidden-vouchers{display:none!important}

@media(max-width:720px){
  .partner-manage-toggle,.partner-vouchers-toggle{font-size:11px;padding:9px 8px}
  .partner-voucher-item{font-size:10px;padding:8px}
  .partner-voucher-item b{font-size:11px}
}
`;
fetch('admin.html?preview=' + Date.now(), {cache:'no-store'})
  .then(r=>{if(!r.ok) throw new Error('Unable to load admin.html'); return r.text();})
  .then(html=>{
    const enhancementJS="\n(function(){\n  function esc2(s){return String(s??\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]))}\n\n  function installBranchCreateUI(){\n    const limit=document.getElementById(\"newPartnerLimit\");\n    const grid=limit?.closest(\".create-grid\");\n    if(!grid || document.getElementById(\"newPartnerBranchBox\")) return;\n\n    const box=document.createElement(\"div\");\n    box.id=\"newPartnerBranchBox\";\n    box.className=\"field wide\";\n    box.innerHTML=`<div class=\"branch-title\">Voucher Claim Branch Permission</div>\n      <label class=\"branch-all\"><input id=\"newPartnerAllBranches\" type=\"checkbox\" checked>\n        <span><b>All Evolution Optical branches</b><br><small style=\"color:#718096\">Or untick to select specific branches.</small></span>\n      </label>\n      <div id=\"newPartnerBranchList\"></div>`;\n    grid.appendChild(box);\n\n    const render=()=>{\n      const all=document.getElementById(\"newPartnerAllBranches\");\n      const list=document.getElementById(\"newPartnerBranchList\");\n      if(!list) return;\n      const rows=(typeof branches!==\"undefined\" && Array.isArray(branches)?branches:[])\n        .filter(b=>String(b.status||\"active\").toLowerCase()===\"active\");\n      list.innerHTML=rows.length?rows.map(b=>`<label><input class=\"newPartnerBranchCheck\" type=\"checkbox\" value=\"${esc2(b.branch_code)}\" ${all?.checked?\"disabled\":\"\"}><span>${esc2(String(b.branch_name||b.branch_code).replace(/\\s*\\(HQ\\)\\s*/gi,\" \").trim())}</span></label>`).join(\"\")\n        :`<small style=\"color:#718096\">Branches will appear after dashboard data finishes loading.</small>`;\n    };\n    box.querySelector(\"#newPartnerAllBranches\").onchange=e=>{\n      box.querySelectorAll(\".newPartnerBranchCheck\").forEach(x=>x.disabled=e.target.checked);\n    };\n    render();\n    setTimeout(render,700);setTimeout(render,1800);\n\n    const btn=document.getElementById(\"createPartnerBtn\");\n    if(btn && !btn.dataset.branchWrapped){\n      btn.dataset.branchWrapped=\"1\";\n      const original=btn.onclick;\n      btn.onclick=async function(e){\n        const code=(document.getElementById(\"newPartnerCode\")?.value||\"\").trim().toUpperCase();\n        const all=document.getElementById(\"newPartnerAllBranches\")?.checked!==false;\n        const codes=[...document.querySelectorAll(\".newPartnerBranchCheck:checked\")].map(x=>x.value);\n        if(!all && !codes.length){\n          const out=document.getElementById(\"createPartnerMsg\");\n          if(typeof msg===\"function\" && out) msg(out,\"Please select at least one branch, or choose All Evolution Optical branches.\");\n          return;\n        }\n        if(original) await original.call(this,e);\n        const out=document.getElementById(\"createPartnerMsg\");\n        if(!code || !out || !/created successfully/i.test(out.textContent||\"\")) return;\n        try{\n          const {data:p,error:qerr}=await db.from(\"partners\").select(\"id,partner_name\").eq(\"partner_code\",code).maybeSingle();\n          if(qerr||!p?.id) throw qerr||new Error(\"Created Partner could not be found.\");\n          const {error}=await db.rpc(\"admin_set_partner_claim_access\",{p_partner_id:p.id,p_all_branches:all,p_branch_codes:codes});\n          if(error) throw error;\n          if(typeof msg===\"function\") msg(out,`${p.partner_name||code} created successfully with branch access saved.`,true);\n        }catch(err){\n          if(typeof msg===\"function\") msg(out,`Partner created, but branch access could not be saved: ${err?.message||err}`);\n        }\n      };\n    }\n  }\n\n  function compactPartnerCards(){\n    const root=document.getElementById(\"partners\");\n    if(!root) return;\n    [...root.querySelectorAll(\".partner\")].forEach(card=>{\n      if(card.dataset.compactReady) return;\n      card.dataset.compactReady=\"1\";\n      const prow=card.querySelector(\".prow\");\n      const nums=card.querySelector(\".nums\");\n      if(!prow||!nums) return;\n      const extra=document.createElement(\"div\");\n      extra.className=\"partner-extra\";\n      let node=nums.nextElementSibling;\n      while(node){const next=node.nextElementSibling;extra.appendChild(node);node=next}\n      card.appendChild(extra);\n      prow.addEventListener(\"click\",ev=>{\n        if(ev.target.closest(\"button,input,select,a\")) return;\n        card.classList.toggle(\"expanded\");\n      });\n    });\n  }\n\n  function bootEnhancements(){\n    installBranchCreateUI();\n    compactPartnerCards();\n    const root=document.getElementById(\"partners\");\n    if(root) new MutationObserver(compactPartnerCards).observe(root,{childList:true});\n  }\n  if(document.readyState===\"loading\") document.addEventListener(\"DOMContentLoaded\",()=>setTimeout(bootEnhancements,0));\n  else setTimeout(bootEnhancements,0);\n})();\n\n\n(function(){\n  function bootV5(){\n    const modal=document.getElementById(\"createPartnerModal\");\n    const openBtn=document.getElementById(\"createPartnerLauncherBtn\");\n    const closeBtn=document.getElementById(\"createPartnerClose\");\n    if(!modal||!openBtn||!closeBtn) return;\n\n    const open=()=>{modal.classList.add(\"open\");document.body.style.overflow=\"hidden\"};\n    const close=()=>{modal.classList.remove(\"open\");document.body.style.overflow=\"\"};\n\n    openBtn.onclick=open;\n    closeBtn.onclick=close;\n    modal.addEventListener(\"click\",e=>{if(e.target===modal) close();});\n\n    const msg=document.getElementById(\"createPartnerMsg\");\n    if(msg){\n      new MutationObserver(()=>{\n        if(/created successfully/i.test(msg.textContent||\"\")) setTimeout(close,650);\n      }).observe(msg,{childList:true,subtree:true,characterData:true});\n    }\n  }\n  if(document.readyState===\"loading\") document.addEventListener(\"DOMContentLoaded\",bootV5);\n  else bootV5();\n})();\n\n\n(function(){\n  function addManageToggles(){\n    const root=document.getElementById(\"partners\");\n    if(!root) return;\n    root.querySelectorAll(\".partner\").forEach(card=>{\n      if(card.querySelector(\".partner-manage-toggle\")) return;\n      const extra=card.querySelector(\".partner-extra\");\n      if(!extra) return;\n      const btn=document.createElement(\"button\");\n      btn.type=\"button\"; btn.className=\"partner-manage-toggle\"; btn.textContent=\"Manage\";\n      card.insertBefore(btn,extra);\n      btn.onclick=()=>card.classList.toggle(\"manage-open\");\n    });\n  }\n\n  function textOf(el,sel){return (el.querySelector(sel)?.textContent||\"\").trim()}\n  function identifyPartner(card){\n    return {\n      name:textOf(card,\"h4,.pname,strong\"),\n      code:textOf(card,\".perf-code,.pcode\").replace(/^Partner:\\s*/i,\"\").trim()\n    };\n  }\n\n  function findVoucherSection(){\n    const cards=[...document.querySelectorAll(\".card,section\")];\n    return cards.find(el=>/Voucher Records|Vouchers/i.test((el.querySelector(\"h2,h3\")?.textContent||\"\")) &&\n      !/Partner Performance/i.test(el.querySelector(\"h2,h3\")?.textContent||\"\"));\n  }\n\n  function collectVoucherRows(section){\n    if(!section) return [];\n    const rows=[...section.querySelectorAll(\".vrecord\")];\n    return rows.map(r=>({\n      node:r,\n      text:(r.textContent||\"\").replace(/\\s+/g,\" \").trim(),\n      html:r.innerHTML\n    }));\n  }\n\n  function groupVouchers(){\n    const perfGrid=document.querySelector(\".perf-grid\");\n    if(!perfGrid) return;\n    const voucherSection=findVoucherSection();\n    const rows=collectVoucherRows(voucherSection);\n\n    perfGrid.querySelectorAll(\".perf-card\").forEach(card=>{\n      if(card.querySelector(\".partner-vouchers-toggle\")) return;\n      const p=identifyPartner(card);\n      const matches=rows.filter(v=>{\n        const t=v.text.toLowerCase();\n        return (p.code && t.includes(p.code.toLowerCase())) ||\n               (p.name && t.includes(p.name.toLowerCase()));\n      });\n\n      const btn=document.createElement(\"button\");\n      btn.type=\"button\"; btn.className=\"partner-vouchers-toggle\";\n      btn.textContent=`Vouchers (${matches.length})`;\n\n      const wrap=document.createElement(\"div\");\n      wrap.className=\"partner-vouchers-wrap\";\n      if(!matches.length){\n        wrap.innerHTML='<div class=\"partner-voucher-empty\">No vouchers for this partner.</div>';\n      }else{\n        matches.forEach(v=>{\n          const item=document.createElement(\"div\");\n          item.className=\"partner-voucher-item\";\n          /* clone the original record content so no database/query logic changes */\n          item.innerHTML=v.html;\n          wrap.appendChild(item);\n        });\n      }\n      card.appendChild(btn); card.appendChild(wrap);\n      btn.onclick=()=>card.classList.toggle(\"vouchers-open\");\n    });\n\n    if(voucherSection){\n      voucherSection.id=voucherSection.id||\"vouchersSection\";\n      voucherSection.classList.add(\"v8-hidden-vouchers\");\n    }\n  }\n\n  function bootV8(){\n    addManageToggles();\n    groupVouchers();\n    const p=document.getElementById(\"partners\");\n    if(p)new MutationObserver(()=>{addManageToggles()}).observe(p,{childList:true,subtree:true});\n    setTimeout(groupVouchers,700);\n    setTimeout(groupVouchers,1800);\n  }\n  if(document.readyState===\"loading\")document.addEventListener(\"DOMContentLoaded\",bootV8);\n  else bootV8();\n})();\n";
    let transformed=html;

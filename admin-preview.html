<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d35">
<title>Evolution Optical • Admin Modern Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef3f9;overflow:hidden}
#adminFrame{width:100%;height:100%;border:0;display:block;background:#eef3f9}
#loading{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 80% 0%,rgba(96,165,250,.15),transparent 30%),#eef3f9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;z-index:10
}
#loading .box{
  background:linear-gradient(145deg,#fff,#f2f6fb);border:1px solid rgba(255,255,255,.95);
  border-radius:22px;padding:24px 28px;text-align:center;
  box-shadow:0 22px 48px rgba(24,39,66,.14),0 7px 16px rgba(26,50,86,.07),inset 0 1px 0 rgba(255,255,255,.85)
}
#loading b{display:block;font-size:16px}#loading small{display:block;color:#64748b;margin-top:5px}
</style>
</head>
<body>
<div id="loading"><div class="box"><b>EVOLUTION OPTICAL</b><small>Loading Modern Admin Preview…</small></div></div>
<iframe id="adminFrame" src="admin.html" title="Evolution Optical Admin"></iframe>

<script>
const frame=document.getElementById("adminFrame");
const loading=document.getElementById("loading");

const modernCSS=`
:root{
  --bg:#eef3f9!important;
  --card:rgba(255,255,255,.94)!important;
  --ink:#0b1220!important;
  --muted:#64748b!important;
  --navy:#0a1d35!important;
  --line:#e3eaf2!important;
  --blue:#2563eb!important;
  --green:#15803d!important;
  --greenbg:#ecfdf3!important;
  --red:#dc2626!important;
  --redbg:#fef2f2!important;
}
html,body{
  background:
    radial-gradient(circle at 86% 0%,rgba(73,137,255,.14),transparent 30%),
    radial-gradient(circle at 10% 20%,rgba(59,130,246,.06),transparent 28%),
    #eef3f9!important;
}
body{min-height:100vh}
.top{
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 55%),
    linear-gradient(135deg,#08192f,#0e2b4e)!important;
  box-shadow:0 12px 30px rgba(5,24,48,.20),inset 0 -1px 0 rgba(255,255,255,.06)!important;
  padding-top:calc(18px + env(safe-area-inset-top))!important;
  padding-bottom:18px!important;
}
.topin{max-width:1080px!important}
.brand h1{letter-spacing:.8px!important;font-weight:900!important}
.brand p{color:#a9c8e8!important}
.ghost{
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05))!important;
  border:1px solid rgba(255,255,255,.18)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 18px rgba(0,0,0,.10)!important;
}
.wrap{width:min(1080px,calc(100% - 24px))!important;margin-top:20px!important}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(244,248,252,.94))!important;
  border:1px solid rgba(255,255,255,.92)!important;
  border-radius:22px!important;
  box-shadow:
    0 20px 42px rgba(31,52,82,.11),
    0 7px 16px rgba(31,52,82,.055),
    inset 0 1px 0 rgba(255,255,255,.9)!important;
  backdrop-filter:blur(14px)!important;
}
h2,h3{color:#0b1c33!important;letter-spacing:-.2px}
.sub{color:#68778b!important}
input,select{
  background:linear-gradient(145deg,#fff,#f8fafc)!important;
  border:1px solid #dbe4ee!important;
  box-shadow:inset 2px 2px 6px rgba(58,78,106,.045),inset -2px -2px 6px rgba(255,255,255,.95)!important;
  outline:none!important;
  transition:.15s ease!important;
}
input:focus,select:focus{
  border-color:#7ba8f7!important;
  box-shadow:0 0 0 4px rgba(37,99,235,.10),inset 1px 1px 4px rgba(58,78,106,.04)!important;
}
.btn{
  background:linear-gradient(145deg,#112842,#081a2f)!important;
  box-shadow:0 9px 18px rgba(8,26,47,.18),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.12)!important;
  transition:transform .12s ease,box-shadow .12s ease!important;
}
.btn:active{transform:translateY(1px)!important;box-shadow:inset 0 3px 8px rgba(0,0,0,.18),0 4px 9px rgba(8,26,47,.12)!important}
.btn.blue{
  background:linear-gradient(145deg,#4b82ff,#2459e6)!important;
  box-shadow:0 9px 18px rgba(37,99,235,.23),inset 0 1px 0 rgba(255,255,255,.35)!important;
}
.btn.green{
  background:linear-gradient(145deg,#20a758,#13783f)!important;
  box-shadow:0 9px 18px rgba(21,128,61,.20),inset 0 1px 0 rgba(255,255,255,.28)!important;
}
.btn.red{
  background:linear-gradient(145deg,#ef5252,#ba1f1f)!important;
  box-shadow:0 9px 18px rgba(220,38,38,.18),inset 0 1px 0 rgba(255,255,255,.22)!important;
}
.stats{gap:12px!important}
.stat,.vstat{
  position:relative!important;overflow:hidden!important;
  background:linear-gradient(145deg,#fff,#f2f7fc)!important;
  border:1px solid rgba(255,255,255,.95)!important;
  box-shadow:8px 8px 18px rgba(72,95,128,.09),-5px -5px 14px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,.95)!important;
}
.stat:before,.vstat:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(#60a5fa,#2563eb);border-radius:4px
}
.stat strong,.vstat b{color:#0b1c33!important}
.partner,.perf-card,.vrecord,.claim-panel{
  background:linear-gradient(145deg,#fff,#f5f8fc)!important;
  border:1px solid #e3eaf2!important;
  box-shadow:0 11px 24px rgba(37,57,87,.075),inset 0 1px 0 rgba(255,255,255,.9)!important;
}
.partner{border-radius:18px!important}
.num,.pm,.claim-summary{
  background:linear-gradient(145deg,#fbfdff,#eef4fa)!important;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.85)!important;
}
.badge,.vstatus{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.04)!important;
}
.claim-option{
  background:linear-gradient(145deg,#fff,#f8fbff)!important;
  border-color:#e0e8f1!important;
  box-shadow:0 5px 12px rgba(40,62,93,.045)!important;
}
.toolbar{gap:10px!important}
.note{color:#718096!important}
#loginCard{max-width:520px!important;margin:6vh auto 0!important}
#loginCard:before{
  content:"";display:block;width:54px;height:54px;margin:0 auto 14px;border-radius:17px;
  background:linear-gradient(135deg,#8b5cf6,#4f7cff 48%,#22d3ee);
  box-shadow:0 13px 24px rgba(53,104,236,.22),inset 0 1px 0 rgba(255,255,255,.4)
}
#loginCard h2{text-align:center!important}
#loginCard .sub{text-align:center!important}
@media(max-width:620px){
  .wrap{width:min(100% - 14px,1080px)!important;margin-top:9px!important}
  .card{padding:14px!important;border-radius:18px!important;margin-bottom:10px!important;box-shadow:0 11px 24px rgba(31,52,82,.09),inset 0 1px 0 rgba(255,255,255,.88)!important}
  .top{padding-left:12px!important;padding-right:12px!important}
  .brand h1{font-size:18px!important}.brand p{font-size:11px!important}
  .stats{gap:7px!important}.stat{padding:10px!important}.stat strong{font-size:20px!important}
  .partner{padding:12px!important}
  .actions{gap:7px!important}
  .btn.small{min-height:40px!important}
  .vfilters{gap:7px!important}
}
`;

frame.addEventListener("load",()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc) throw new Error("No document");
    let style=doc.getElementById("modernPremium3D");
    if(!style){
      style=doc.createElement("style");
      style.id="modernPremium3D";
      style.textContent=modernCSS;
      doc.head.appendChild(style);
    }
    loading.style.display="none";
  }catch(err){
    loading.querySelector("small").textContent="Preview must be opened from the same GitHub Pages site.";
  }
});
</script>
</body>
</html>

name: Fix Admin Voucher Stats Sync

on:
  push:
    paths:
      - '.github/workflows/fix-admin-voucher-stats.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix filtered voucher stats
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          s = s.replace('multi-voucher-partner-filter-v1', 'multi-voucher-partner-filter-v1.1', 1)
          old = '''function renderVouchers(){const q=$("voucherSearch").value.trim(),pf=$("voucherPartner").value;if(pf==="SELECT"&&!q){$("voucherRecords").innerHTML='<div class="sub" style="padding:24px 4px;text-align:center">Select a Partner to view vouchers.</div>';$("vTotal").textContent="0";$("vValid").textContent="0";$("vRedeemed").textContent="0";$("vExpired").textContent="0";return}const list=filteredVouchers();$("voucherRecords").innerHTML=list.length?list.map(v=>{const st=voucherEffectiveStatus(v);return `<div class="vrecord"><div class="vtop"><div style="flex:1"><div class="vcode">${esc(v.voucher_code||v.id)}</div><div class="pcode">${esc(engineLabel(v))}</div></div><span class="vstatus ${st.toLowerCase()}">${st}</span></div><div class="vmeta"><b>Customer:</b> ${esc(v.customer_name||"—")}<br><b>Partner:</b> ${esc(partnerNameFor(v))}<br><b>Type:</b> ${esc(engineLabel(v))}<br><b>Valid Until:</b> ${esc(v.expiry_date||"—")}<br><b>Redeem at:</b> ${esc(branchLabel(v))}${v.redeemed_at?`<br><b>Redeemed At:</b> ${esc(new Date(v.redeemed_at).toLocaleString("en-MY"))}`:""}</div></div>`}).join(""):`<p class="sub">No voucher records found.</p>`}'''
          new = '''function renderVouchers(){const q=$("voucherSearch").value.trim(),pf=$("voucherPartner").value;if(pf==="SELECT"&&!q){$("voucherRecords").innerHTML='<div class="sub" style="padding:24px 4px;text-align:center">Select a Partner to view vouchers.</div>';$("vTotal").textContent="0";$("vValid").textContent="0";$("vRedeemed").textContent="0";$("vExpired").textContent="0";return}const list=filteredVouchers(),c={VALID:0,REDEEMED:0,EXPIRED:0};list.forEach(v=>c[voucherEffectiveStatus(v)]++);$("vTotal").textContent=list.length;$("vValid").textContent=c.VALID;$("vRedeemed").textContent=c.REDEEMED;$("vExpired").textContent=c.EXPIRED;$("voucherRecords").innerHTML=list.length?list.map(v=>{const st=voucherEffectiveStatus(v);return `<div class="vrecord"><div class="vtop"><div style="flex:1"><div class="vcode">${esc(v.voucher_code||v.id)}</div><div class="pcode">${esc(engineLabel(v))}</div></div><span class="vstatus ${st.toLowerCase()}">${st}</span></div><div class="vmeta"><b>Customer:</b> ${esc(v.customer_name||"—")}<br><b>Partner:</b> ${esc(partnerNameFor(v))}<br><b>Type:</b> ${esc(engineLabel(v))}<br><b>Valid Until:</b> ${esc(v.expiry_date||"—")}<br><b>Redeem at:</b> ${esc(branchLabel(v))}${v.redeemed_at?`<br><b>Redeemed At:</b> ${esc(new Date(v.redeemed_at).toLocaleString("en-MY"))}`:""}</div></div>`}).join(""):`<p class="sub">No voucher records found.</p>`}'''
          if old not in s:
              raise SystemExit('Expected renderVouchers block not found; refusing to patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "Ericchaow"
          git config user.email "eri_evo@yahoo.com"
          git add admin.html
          git commit -m "Admin vouchers: sync filtered stats"
          git push

name: UI white inputs Partner Staff

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-white-inputs-partner-staff.yml'

permissions:
  contents: write

jobs:
  ui-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply presentation-only CSS
        shell: python
        run: |
          from pathlib import Path

          partner = Path('partner.html')
          p = partner.read_text()
          oldp = 'label{color:#d9e3ff}input,select{border-color:rgba(100,128,210,.55);background:linear-gradient(180deg,#101942,#07132f);color:#fff;box-shadow:inset 0 2px 5px rgba(0,0,0,.28)}input::placeholder{color:#8e9ab8}'
          newp = 'label{color:#d9e3ff}input,select,textarea{border-color:rgba(100,128,210,.55);background:#fff!important;color:#172033!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}input::placeholder,textarea::placeholder{color:#8a96aa!important}select option{background:#fff;color:#172033}.staff-actions .btn.secondary{background:linear-gradient(180deg,#3549a8,#182b73 58%,#0d1c4c) padding-box,linear-gradient(135deg,#c062ff,#747dff,#31dce9) border-box!important;color:#fff!important}'
          if p.count(oldp) != 1:
              raise SystemExit(f'Partner expected 1 old style, found {p.count(oldp)}')
          partner.write_text(p.replace(oldp,newp))

          staff = Path('staff.html')
          s = staff.read_text()
          olds = 'label{color:#d9e3ff}input,textarea,select{border-color:rgba(100,128,210,.55);background:linear-gradient(180deg,#101942,#07132f);color:#fff;box-shadow:inset 0 2px 5px rgba(0,0,0,.28)}input::placeholder,textarea::placeholder{color:#8e9ab8}'
          news = 'label{color:#d9e3ff}input,textarea,select{border-color:rgba(100,128,210,.55);background:#fff!important;color:#172033!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}input::placeholder,textarea::placeholder{color:#8a96aa!important}select option{background:#fff;color:#172033}'
          if s.count(olds) != 1:
              raise SystemExit(f'Staff expected 1 old style, found {s.count(olds)}')
          staff.write_text(s.replace(olds,news))
      - name: Commit UI-only change
        run: |
          git config user.name "Ericchaow"
          git config user.email "eri_evo@yahoo.com"
          git add partner.html staff.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "UI: white form controls and blue Rename"
          git push

name: Go Live RM60 Branch Fix
on:
  push:
    paths:
      - '.github/workflows/go-live-rm60-branch-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Partner RM60 branch fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('partner.html')
          s=p.read_text()
          old='function redemptionCodesFor(o){if(!o)return[];const versionCodes=o.version_branch_codes||[];if(partnerClaimAll&&o.all_branches)return Object.keys(OUTLETS);if(partnerClaimAll&&!o.all_branches)return versionCodes;if(!partnerClaimAll&&o.all_branches)return partnerClaimCodes;return partnerClaimCodes.filter(c=>versionCodes.includes(c))}'
          new='function redemptionCodesFor(o){if(!o)return[];const versionCodes=o.version_branch_codes||[];if(o.template_code==="EVO-FREE-GLASSES")return partnerClaimAll?Object.keys(OUTLETS):partnerClaimCodes;if(partnerClaimAll&&o.all_branches)return Object.keys(OUTLETS);if(partnerClaimAll&&!o.all_branches)return versionCodes;if(!partnerClaimAll&&o.all_branches)return partnerClaimCodes;return partnerClaimCodes.filter(c=>versionCodes.includes(c))}'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one patch target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partner.html
          git diff --cached --check
          git commit -m 'Fix RM60 Partner branch availability at go-live'
          git push

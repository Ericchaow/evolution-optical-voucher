name: Rename RM60 Remaining Label

on:
  push:
    paths:
      - '.github/workflows/rename-rm60-available.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename display label only
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          old = '<span>RM60 Remaining</span>'
          new = '<span>RM60 Available</span>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 label, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Commit label-only change
        run: |
          git config user.name "Ericchaow"
          git config user.email "eri_evo@yahoo.com"
          git add admin.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Admin: rename RM60 Remaining to Available"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a">
<title>Evolution Optical • Multi Voucher Partner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 18px;background:linear-gradient(135deg,#09203e,#06162d);color:#fff;position:sticky;top:0;z-index:10}.topin{max-width:760px;margin:auto;display:flex;gap:12px;align-items:center}.brand{flex:1}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:#cbd5e1}.wrap{width:min(760px,calc(100% - 20px));margin:16px auto 50px}.card{padding:18px;margin-bottom:14px;border-radius:20px;background:#fff;box-shadow:0 14px 32px rgba(35,57,88,.10)}h2,h3{margin:0 0 8px}.sub{color:#64748b;line-height:1.5}.field{margin-top:14px}label{display:block;font-size:13px;font-weight:850;margin-bottom:6px}input,select{width:100%;min-height:49px;padding:12px 13px;border:1px solid #d6e0ec;border-radius:14px;font-size:16px;background:#fff}.btn{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:14px;font-weight:900;color:#fff;background:#0f172a}.btn:disabled{opacity:.55}.green{background:linear-gradient(135deg,#29c879,#15803d)}.blue{background:linear-gradient(135deg,#4e89ff,#2563eb)}.ghost{width:auto;margin:0;background:#ffffff14;border:1px solid #ffffff38;padding:9px 12px}.msg{margin-top:12px;padding:11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.ok{background:#ecfdf3;color:#15803d}.err{background:#fef2f2;color:#b91c1c}.voucher-list{display:grid;gap:9px;margin-top:14px}.voucher-row{padding:12px;border:1px solid #dbe5f1;border-radius:14px;background:#f8fbff}.voucher-row b{display:block}.voucher-row span{display:block;margin-top:4px;color:#64748b;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:11px;border-radius:14px;background:#f8fafc;border:1px solid #e0e8f1}.stat span{font-size:11px;color:#64748b}.stat strong{display:block;font-size:20px;margin-top:4px}#qr{width:220px;height:220px;margin:16px auto;display:flex;align-items:center;justify-content:center;padding:10px;background:#fff;border:3px solid #244e9f;border-radius:16px}#qr img,#qr canvas{width:100%!important;height:100%!important}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.card{padding:14px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><h1>EVOLUTION OPTICAL</h1><p>Multi Voucher Partner Pilot</p></div><button id="logout" class="btn ghost hidden">Logout</button></div></header>
<main class="wrap">
<section id="loginCard" class="card"><h2>Partner Login</h2><p class="sub">Use the same Partner / Partner Staff login.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn blue">SIGN IN</button><div id="loginMsg" class="msg hidden"></div></section>
<div id="app" class="hidden">
<section class="card"><h2 id="partnerName">Partner</h2><p id="partnerCode" class="sub"></p><div id="voucherList" class="voucher-list"></div></section>
<section class="card"><h3>Create Voucher</h3><div class="field"><label>Voucher Type</label><select id="voucherVersion"></select></div><div class="field"><label>Customer Name</label><input id="customerName" placeholder="Customer full name"></div><div class="field"><label>Phone</label><input id="customerPhone" inputmode="tel" placeholder="01xxxxxxxx"></div><div id="selectedBalance" class="sub" style="margin-top:10px"></div><button id="create" class="btn green">GENERATE QR VOUCHER</button><div id="createMsg" class="msg hidden"></div></section>
<section id="result" class="card hidden"><h3>Voucher Generated</h3><div class="stats"><div class="stat"><span>TYPE</span><strong id="rType">—</strong></div><div class="stat"><span>EXPIRES</span><strong id="rExpiry">—</strong></div><div class="stat"><span>REMAINING</span><strong id="rRemaining">—</strong></div></div><div id="qr"></div><div style="text-align:center"><b id="rCode"></b></div></section>
</div>
</main>
<script>
const URL='https://hukihbcyyqhanaqrizvm.supabase.co',KEY='sb_publishable_kpPFeGYpedq2auo01Zo50A_aiSjdeVh';
const db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let dashboard=null,options=[];
function msg(id,text,ok=false){const n=$(id);n.textContent=text||'';n.className='msg '+(ok?'ok':'err');n.classList.toggle('hidden',!text)}
function errorText(e){return e?.message||e?.error_description||String(e||'Unknown error')}
function showLogin(){$('loginCard').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}
function showApp(){$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden')}
async function login(){
  msg('loginMsg','');const btn=$('login');btn.disabled=true;btn.textContent='SIGNING IN…';
  try{
    const email=$('email').value.trim(),password=$('password').value;
    if(!email||!password){msg('loginMsg','Please enter Email and Password.');return}
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error){msg('loginMsg','Login failed: '+error.message);return}
    try{await load()}catch(e){console.error('Pilot load failed',e);showLogin();msg('loginMsg','Login succeeded, but Partner data could not load:\n'+errorText(e));}
  }catch(e){console.error('Pilot login failed',e);msg('loginMsg','Unexpected login error:\n'+errorText(e));}
  finally{btn.disabled=false;btn.textContent='SIGN IN'}
}
async function load(){
  const {data:{user},error:userError}=await db.auth.getUser();if(userError)throw userError;if(!user)throw new Error('No authenticated user session found.');
  const {data,error}=await db.rpc('get_my_partner_dashboard');if(error)throw new Error('Dashboard: '+error.message);if(!data)throw new Error('Active Partner dashboard not found.');
  dashboard=data;$('partnerName').textContent=data.partner_name||'Partner';$('partnerCode').textContent=(data.partner_code||'')+' • '+String(data.role||'').replace('_',' ').toUpperCase();
  await loadOptions();showApp();
}
async function loadOptions(){
  options=[];const pid=dashboard?.partner_id;if(!pid)throw new Error('Partner ID missing from dashboard.');
  const {data:allocs,error:aerr}=await db.from('partner_voucher_allocations').select('id,version_id,quantity_allocated,quantity_revoked,status').eq('partner_id',pid).eq('status','active');if(aerr)throw new Error('Allocations: '+aerr.message);
  const a=allocs||[];if(!a.length){renderOptions();return}
  const vids=[...new Set(a.map(x=>x.version_id).filter(Boolean))];
  const {data:vers,error:verr}=await db.from('voucher_versions').select('id,template_id,version_no,version_name,face_value,discount_percent,validity_type,valid_days,valid_until,status').in('id',vids).eq('status','active');if(verr)throw new Error('Versions: '+verr.message);
  const tids=[...new Set((vers||[]).map(x=>x.template_id).filter(Boolean))];
  const {data:temps,error:terr}=await db.from('voucher_templates').select('id,template_code,template_name,voucher_category,status').in('id',tids).eq('status','active');if(terr)throw new Error('Templates: '+terr.message);
  const aids=a.map(x=>x.id);
  const {data:issued,error:ierr}=await db.from('vouchers').select('id,allocation_id').in('allocation_id',aids);if(ierr)throw new Error('Issued vouchers: '+ierr.message);
  for(const al of a){const v=(vers||[]).find(x=>x.id===al.version_id);if(!v)continue;const t=(temps||[]).find(x=>x.id===v.template_id);if(!t)continue;const used=(issued||[]).filter(x=>x.allocation_id===al.id).length;const remaining=Math.max(0,Number(al.quantity_allocated)-Number(al.quantity_revoked)-used);if(remaining<=0)continue;options.push({allocation_id:al.id,version_id:v.id,template_code:t.template_code,template_name:t.template_name,category:t.voucher_category,version_no:v.version_no,version_name:v.version_name,face_value:v.face_value,discount_percent:v.discount_percent,remaining});}
  renderOptions();
}
function label(o){if(o.face_value!=null)return `RM${Number(o.face_value)} • ${o.template_name}`;if(o.discount_percent!=null)return `${Number(o.discount_percent)}% • ${o.template_name}`;return o.template_name}
function renderOptions(){const sel=$('voucherVersion');sel.innerHTML=options.length?options.map(o=>`<option value="${o.version_id}">${label(o)} — ${o.remaining} left</option>`).join(''):'<option value="">No active voucher allocation</option>';$('voucherList').innerHTML=options.length?options.map(o=>`<div class="voucher-row"><b>${label(o)}</b><span>${o.template_code} V${o.version_no} • Available ${o.remaining}</span></div>`).join(''):'<div class="sub">No active voucher allocation.</div>';updateBalance()}
function selected(){return options.find(o=>o.version_id===$('voucherVersion').value)}
function updateBalance(){const o=selected();$('selectedBalance').textContent=o?`Available: ${o.remaining}`:'No voucher available';$('create').disabled=!o||!dashboard?.can_issue_voucher}
async function createVoucher(){msg('createMsg','');const o=selected(),name=$('customerName').value.trim(),phone=$('customerPhone').value.trim();if(!dashboard?.can_issue_voucher){msg('createMsg','Staff access is disabled.');return}if(!o){msg('createMsg','Please select an available Voucher Type.');return}if(!name||!phone){msg('createMsg','Please complete Customer Name and Phone.');return}const btn=$('create');btn.disabled=true;btn.textContent='GENERATING…';try{const {data,error}=await db.rpc('create_partner_multi_voucher_controlled',{p_version_id:o.version_id,p_customer_name:name,p_customer_phone:phone});if(error){msg('createMsg',error.message);return}msg('createMsg',`Voucher ${data.voucher_code} created successfully.`,true);$('rType').textContent=data.voucher_type||label(o);$('rExpiry').textContent=data.expiry_date||'—';$('rRemaining').textContent=data.remaining_after_issue??'—';$('rCode').textContent=data.voucher_code;const q=$('qr');q.innerHTML='';new QRCode(q,{text:data.voucher_code,width:420,height:420,correctLevel:QRCode.CorrectLevel.M});$('result').classList.remove('hidden');await loadOptions()}catch(e){msg('createMsg','Create failed: '+errorText(e))}finally{btn.textContent='GENERATE QR VOUCHER';updateBalance()}}
$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('voucherVersion').onchange=updateBalance;$('create').onclick=createVoucher;$('logout').onclick=async()=>{await db.auth.signOut();dashboard=null;options=[];showLogin()};
db.auth.getSession().then(async({data})=>{if(data?.session){try{await load()}catch(e){showLogin();msg('loginMsg','Existing session found, but Partner data could not load:\n'+errorText(e))}}else showLogin()}).catch(e=>{showLogin();msg('loginMsg','Session error:\n'+errorText(e))});
</script>
</body></html>

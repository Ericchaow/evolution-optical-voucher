<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Evolution Optical • Multi Voucher Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#050716;color:#f7f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:calc(18px + env(safe-area-inset-top)) 18px;background:#07152f;position:sticky;top:0}.wrap{width:min(980px,calc(100% - 20px));margin:16px auto}.card{padding:16px;margin-bottom:12px;border:1px solid #344b86;border-radius:18px;background:linear-gradient(155deg,#171746,#0b1b42 60%,#06132f)}h1,h2,h3{margin:0 0 8px}.sub{color:#bcc7e3}.field{margin-top:12px}label{display:block;margin-bottom:5px;font-weight:800}input{width:100%;padding:12px;border:1px solid #5369a8;border-radius:12px;background:#0c1636;color:#fff;font-size:16px}.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#3158d7;color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{padding:13px;border:1px solid #3b4f86;border-radius:14px;background:#0d1839}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.m{padding:8px;border-radius:10px;background:#101f48}.m span{display:block;color:#9fb0d7;font-size:10px}.m b{font-size:18px}.tag{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:999px;background:#143a35;color:#69efb7;font-size:10px;font-weight:900}.err{margin-top:10px;padding:10px;border-radius:10px;background:#4b1727;color:#ff9aae}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}} </style></head><body><header class="top"><h1>EVOLUTION OPTICAL</h1><div class="sub">Multi Voucher Performance</div></header><main class="wrap"><section id="login" class="card"><h2>Admin Login</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="signin" class="btn">SIGN IN</button><div id="msg" class="err hidden"></div></section><section id="app" class="hidden"><div class="card"><h2>Multi Voucher Performance</h2><p class="sub">Separated by Partner and Voucher Type.</p><button id="refresh" class="btn">REFRESH</button></div><div id="report" class="grid"></div></section></main><script>const db=window.supabase.createClient('https://hukihbcyyqhanaqrizvm.supabase.co','sb_publishable_kpPFeGYpedq2auo01Zo50A_aiSjdeVh');const $=id=>document.getElementById(id);function err(t){$('msg').textContent=t;$('msg').classList.toggle('hidden',!t)}async function auth(){const{data:isAdmin,error:adminError}=await db.rpc('is_voucher_admin');if(adminError||isAdmin!==true)throw new Error('Admin access required');$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}async function signIn(){err('');const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){err(error.message);return}try{await auth()}catch(e){err(e.message)}}async function load(){const[a,v,t,vs]=await Promise.all([db.from('partner_voucher_allocations').select('id,partner_id,version_id,quantity_allocated,quantity_revoked,status').eq('status','active'),db.from('voucher_versions').select('id,template_id,version_no,version_name,status'),db.from('voucher_templates').select('id,template_code,template_name,status'),db.from('vouchers').select('id,partner_id,allocation_id,status')]);for(const r of[a,v,t,vs])if(r.error)throw r.error;const{data:ps,error:pe}=await db.from('partners').select('id,partner_code,partner_name,status');if(pe)throw pe;const rows=[];for(const al of a.data||[]){const p=(ps||[]).find(x=>x.id===al.partner_id);if(!p||String(p.partner_code).toUpperCase()==='ADMIN')continue;const ver=(v.data||[]).find(x=>x.id===al.version_id),tmp=ver&&(t.data||[]).find(x=>x.id===ver.template_id);if(!ver||!tmp)continue;const vv=(vs.data||[]).filter(x=>x.allocation_id===al.id),issued=vv.length,redeemed=vv.filter(x=>String(x.status).toLowerCase()==='redeemed').length,valid=vv.filter(x=>String(x.status).toLowerCase()==='valid').length,available=Math.max(0,Number(al.quantity_allocated)-Number(al.quantity_revoked)-issued),rate=issued?((redeemed/issued)*100).toFixed(1):'0.0';rows.push({p,tmp,ver,al,issued,redeemed,valid,available,rate})}$('report').innerHTML=rows.map(r=>`<div class="row"><h3>${r.p.partner_name}</h3><div class="sub">${r.p.partner_code} • ${r.tmp.template_name} • V${r.ver.version_no}</div><span class="tag">${r.tmp.template_code}</span><div class="metrics"><div class="m"><span>ALLOCATED</span><b>${r.al.quantity_allocated}</b></div><div class="m"><span>ISSUED</span><b>${r.issued}</b></div><div class="m"><span>AVAILABLE</span><b>${r.available}</b></div><div class="m"><span>REDEEMED</span><b>${r.redeemed}</b></div><div class="m"><span>VALID</span><b>${r.valid}</b></div><div class="m"><span>RATE</span><b>${r.rate}%</b></div></div></div>`).join('')||'<div class="card">No allocation data.</div>'} $('signin').onclick=signIn;$('refresh').onclick=()=>load().catch(e=>alert(e.message));db.auth.getSession().then(({data})=>{if(data.session)auth().catch(()=>{})});</script></body></html>

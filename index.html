<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolution Optical Voucher</title>
<style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:white;padding:24px 18px;font-size:22px;font-weight:800}.card{background:white;margin:14px;padding:18px;border-radius:18px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font-size:16px}input,select{border:1px solid #ccc}button{border:0;background:#111827;color:white;font-weight:800;margin-top:15px}.voucher{text-align:center;border:1px dashed #aaa;border-radius:14px;padding:18px}.hidden{display:none}#qrcode{display:flex;justify-content:center;margin:15px}.valid{background:#e9f8ef;color:#166534;padding:10px;border-radius:10px;font-weight:800}</style></head>
<body><header>EVOLUTION OPTICAL<br><small style="font-size:12px;font-weight:400">QR Voucher</small></header>
<div class="card"><h2>Create Voucher</h2><label>Customer Name</label><input id="name"><label>Phone</label><input id="phone"><label>IC / Passport</label><input id="ic"><label>Voucher</label><select id="type"><option>Free Glasses</option><option>RM59 Free Glasses</option><option>RM100 Optical Voucher</option></select><label>Expiry</label><input id="expiry" type="date"><button onclick="go()">GENERATE QR VOUCHER</button></div>
<div id="out" class="card hidden"><div class="voucher"><b>EVOLUTION OPTICAL</b><h2 id="vt"></h2><div id="qrcode"></div><b id="vid"></b><p id="vc"></p><p id="ve"></p><div class="valid">VALID</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
function go(){let n=name.value.trim(),p=phone.value.trim();if(!n||!p){alert("Please enter customer name and phone");return}let x="EO-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,8).toUpperCase();out.classList.remove("hidden");vt.textContent=type.value;vid.textContent=x;vc.textContent=n+" • "+p;ve.textContent="Valid until: "+(expiry.value||"No expiry");qrcode.innerHTML="";new QRCode(qrcode,{text:x,width:190,height:190})}
</script></body></html>
